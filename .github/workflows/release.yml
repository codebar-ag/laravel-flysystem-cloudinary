name: release

on:
  pull_request:
    types:
      - closed
    branches:
      - main
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # `closed` fires for merged AND abandoned pull requests. Without this guard,
    # closing a PR without merging still bumps the version and pushes a tag.
    if: github.event.pull_request.merged == true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: '0'
      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
          WITH_V: true
          RELEASE_BRANCHES: main
          DEFAULT_BUMP: minor
